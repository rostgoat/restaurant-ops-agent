services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/schema.sql:/data/schema.sql:ro
      - ./data/out:/data/out:ro
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops_eval"]
      interval: 2s
      timeout: 2s
      retries: 60

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: runtime
    environment:
      DATABASE_URL: postgresql://ops:ops@db:5432/ops_demo
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      POLICIES_ROOT: /data/policies
      WEB_ORIGIN: http://localhost:3000
      API_TOKEN: ${API_TOKEN:-}
    volumes:
      - ./data/policies:/data/policies:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Not started with `up`. Runs the tests, the evaluation, the policy index
  # and the generator inside the image, against this checkout:
  #   docker compose run --rm tools python -m pytest
  tools:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: api/Dockerfile
      target: tools
    environment:
      DATABASE_URL: postgresql://ops:ops@db:5432/ops_demo
      EVAL_DATABASE_URL: postgresql://ops:ops@db:5432/ops_eval
      TEST_DATABASE_URL: postgresql://ops:ops@db:5432/ops_test
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - .:/repo
    working_dir: /repo/api
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
