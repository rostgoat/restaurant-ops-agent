# Lint, type-check, test and build on every push and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ops
          POSTGRES_DB: ops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ops -d ops_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://ops:ops@127.0.0.1:5432/ops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e "api[dev]" numpy
      - name: generate and load the dataset
        run: |
          python data/generate.py --out data/out --months 12 --seed 42
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f data/schema.sql
          cd data/out && psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f load.sql
      - run: ruff check api/app api/tests api/scripts
      - run: ruff format --check api/app api/tests api/scripts
      - run: python -m pytest
        working-directory: api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm build
