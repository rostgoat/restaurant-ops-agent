# The API on Fly. The site is on Vercel and the database on Neon.
#   fly launch --no-deploy --copy-config   (once, to create the app)
#   fly secrets set DATABASE_URL=... ANTHROPIC_API_KEY=... OPENAI_API_KEY=... API_TOKEN=...
#   fly deploy
app = "restaurant-ops-agent"
primary_region = "iad"

[build]
  dockerfile = "api/Dockerfile"
  # The last stage is the tools image, which has no command; the API is the runtime stage.
  build-target = "runtime"

[env]
  PORT = "8000"
  WEB_ORIGIN = "https://restaurant-ops-agent.vercel.app"

[http_service]
  internal_port = 8000
  force_https = true
  # Always one machine up, so the first rerun of the day does not wait on a cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
